<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS — Conquest Atlas of Roadmaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/globe.css">
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="nebula"></div>
  <div class="topbar"><span>ATLAS</span><span>Conquest Atlas</span></div>

  <header class="hero">
    <h1>ATLAS <span class="sub">Conquest Atlas</span></h1>
    <p class="tagline">Drag to rotate. Click a world to enter its roadmap.</p>
  </header>

  <div class="globeStage" id="globeStage">
    <div class="globe" id="globe"></div>
  </div>

  <div class="hint">Roadmaps loaded from <code>roadmaps/manifest.json</code></div>

  <script src="assets/starfield.js"></script>
  <script src="assets/globe.js"></script>
</body>
</html>
