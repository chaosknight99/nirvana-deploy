<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div class="brand-block">
          <span class="eyebrow">ATLAS</span>
          <h1>Conquest Atlas</h1>
        </div>
        <div id="map-panel" class="panel hidden">
          <p id="panel-tag">Roadmap</p>
          <h2 id="panel-title">Loading…</h2>
          <p id="panel-copy">Preparing the map…</p>
          <ul id="panel-topics"></ul>
          <button id="enter-roadmap">Open map</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
