<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap — ATLAS Conquest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/roadmap.css">
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="nebula"></div>
  <div class="topbar"><a href="index.html">&larr; All Roadmaps</a><span id="pageTitle"></span></div>

  <header class="hero">
    <h1 id="rmTitle">Loading&hellip;</h1>
    <p class="tagline" id="rmTagline"></p>
    <div class="ringWrap">
      <svg viewBox="0 0 120 120" class="ring">
        <circle cx="60" cy="60" r="52" class="ringTrack"/>
        <circle cx="60" cy="60" r="52" class="ringFill" id="ringFill"/>
      </svg>
      <div class="ringCenter">
        <div class="rankName" id="rankTitle">—</div>
        <div class="rankCount"><span id="conqueredCount">0</span>/<span id="totalCount">0</span></div>
      </div>
    </div>
  </header>

  <main class="mapWrap" id="mapWrap">
    <svg id="map" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid meet"></svg>
  </main>

  <section class="detail" id="detail">
    <h2 id="detailName">Select a star</h2>
    <p id="detailDesc">Click any star — major milestone or subtopic — to see what it represents, and mark it conquered once you've built, explained and proven it.</p>
    <button id="toggleBtn">Mark Conquered</button>
  </section>

  <footer>
    <button id="resetBtn">Reset This Roadmap</button>
    <span class="footnote">Progress is saved in this browser, per roadmap.</span>
  </footer>

  <script src="assets/starfield.js"></script>
  <script src="assets/roadmap-parser.js"></script>
  <script src="assets/roadmap.js"></script>
</body>
</html>
